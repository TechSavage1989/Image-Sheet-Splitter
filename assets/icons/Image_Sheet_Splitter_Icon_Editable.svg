<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024">

  <title>Image Sheet Splitter Application Icon</title>
  <desc>
    Editable vector icon showing a sprite sheet separating into individual image files.
    The overall internal imagery is centered with equal left-right and equal top-bottom spacing.
  </desc>

  <defs>
    <clipPath id="sheetClip">
      <rect x="94" y="259" width="520" height="550" rx="44" ry="44"/>
    </clipPath>

    <g id="cell_top_right">
      <rect x="0" y="0" width="176" height="166" fill="#3f659f"/>
      <circle cx="88" cy="54" r="28" fill="#c5cedd"/>
      <rect x="59" y="90" width="58" height="43" rx="8" fill="#2d3748"/>
    </g>

    <g id="cell_middle_right">
      <rect x="0" y="0" width="276" height="190" fill="#4770bd"/>
      <circle cx="101" cy="66" r="25" fill="#c5cedd"/>
      <rect x="71" y="102" width="60" height="50" rx="9" fill="#2d3748"/>
      <path d="M146 164 L194 86 L242 164 Z" fill="#7486a6"/>
    </g>

    <g id="cell_bottom_right">
      <rect x="0" y="0" width="176" height="194" fill="#5e7fd0"/>
      <circle cx="88" cy="58" r="24" fill="#c5cedd"/>
      <path d="M45 158 L88 90 L131 158 Z" fill="#2d3748"/>
    </g>
  </defs>

  <g id="background">
    <rect x="30" y="30" width="964" height="964" rx="176" ry="176"
          fill="#1f232a"
          stroke="#606b80"
          stroke-width="34"/>
  </g>

  <g id="source-sheet">
    <rect x="82" y="247" width="544" height="574" rx="54" ry="54"
          fill="#1f232a"
          stroke="#606b80"
          stroke-width="18"/>

    <g clip-path="url(#sheetClip)">
      <rect x="94" y="259" width="168" height="166" fill="#4770bd"/>
      <rect x="262" y="259" width="176" height="166" fill="#5e7fd0"/>
      <rect x="94" y="425" width="244" height="190" fill="#5e7fd0"/>
      <rect x="94" y="615" width="176" height="194" fill="#3f659f"/>
      <rect x="270" y="615" width="168" height="194" fill="#4770bd"/>

      <g id="other-source-sprites">
        <circle cx="178" cy="313" r="31" fill="#c5cedd"/>
        <rect x="152" y="353" width="52" height="46" rx="9" fill="#2d3748"/>

        <circle cx="350" cy="313" r="29" fill="#7486a6"/>
        <path d="M315 393 L350 340 L385 393 Z" fill="#2d3748"/>

        <circle cx="174" cy="489" r="28" fill="#7486a6"/>
        <path d="M132 589 L174 519 L216 589 Z" fill="#2d3748"/>
        <circle cx="254" cy="507" r="19" fill="#c5cedd"/>

        <circle cx="182" cy="673" r="24" fill="#c5cedd"/>
        <rect x="155" y="709" width="54" height="54" rx="10" fill="#2d3748"/>

        <rect x="310" y="655" width="90" height="90" rx="17" fill="#7486a6"/>
      </g>

      <use href="#cell_top_right" x="438" y="259"/>
      <use href="#cell_middle_right" x="338" y="425"/>
      <use href="#cell_bottom_right" x="438" y="615"/>

      <g id="sheet-separators" stroke="#1f232a" stroke-width="12">
        <line x1="262" y1="259" x2="262" y2="425"/>
        <line x1="438" y1="259" x2="438" y2="425"/>
        <line x1="94" y1="425" x2="614" y2="425"/>
        <line x1="338" y1="425" x2="338" y2="615"/>
        <line x1="94" y1="615" x2="614" y2="615"/>
        <line x1="270" y1="615" x2="270" y2="809"/>
        <line x1="438" y1="615" x2="438" y2="809"/>
      </g>
    </g>

    <g id="source-highlight-outlines"
       fill="none"
       stroke="#7f91b3"
       stroke-width="8">
      <rect x="438" y="259" width="176" height="166"/>
      <rect x="338" y="425" width="276" height="190"/>
      <rect x="438" y="615" width="176" height="194"/>
    </g>
  </g>

  <g id="individual-files">
    <g id="file-1">
      <rect x="732" y="166" width="182" height="182" rx="32"
            fill="#1f232a"
            stroke="#606b80"
            stroke-width="15"/>
      <path d="M844 166 L914 236 L844 236 Z" fill="#606b80"/>
      <rect x="753" y="200" width="140" height="132" rx="16" fill="#25344d"/>
      <g transform="translate(753 200) scale(0.79518)">
        <use href="#cell_top_right"/>
      </g>
    </g>

    <g id="file-2">
      <rect x="720" y="394" width="222" height="194" rx="34"
            fill="#1f232a"
            stroke="#606b80"
            stroke-width="15"/>
      <path d="M856 394 L942 480 L856 480 Z" fill="#606b80"/>
      <rect x="749" y="431" width="164" height="113" rx="18" fill="#25344d"/>
      <g transform="translate(749 431) scale(0.5942)">
        <use href="#cell_middle_right"/>
      </g>
    </g>

    <g id="file-3">
      <rect x="702" y="642" width="228" height="216" rx="36"
            fill="#1f232a"
            stroke="#606b80"
            stroke-width="15"/>
      <path d="M840 642 L930 732 L840 732 Z" fill="#606b80"/>
      <rect x="748" y="677" width="136" height="150" rx="18" fill="#25344d"/>
      <g transform="translate(748 677) scale(0.77273)">
        <use href="#cell_bottom_right"/>
      </g>
    </g>
  </g>

  <g id="split-flow-overlay"
     fill="#5e7fd0"
     stroke="#1f232a"
     stroke-width="7"
     stroke-linejoin="round">
    <path d="M582 327 L690 327 L690 303 L738 346 L690 389 L690 365 L582 365 Z"/>
    <path d="M582 521 L704 521 L704 497 L752 540 L704 583 L704 559 L582 559 Z"/>
    <path d="M582 714 L688 714 L688 690 L736 733 L688 776 L688 752 L582 752 Z"/>
  </g>
</svg>
