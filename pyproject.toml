[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-sheet-splitter"
version = "1.7.0"
description = "Portable Windows utility for splitting image sheets separated by a solid background."
requires-python = ">=3.10"
dependencies = [
  "Pillow==12.3.0",
  "tkinterdnd2==0.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]
