name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.7.0
        required: true
      ref:
        description: Commit or branch to release
        required: true
        default: main
      confirm:
        description: Type publish to confirm release creation
        required: true

permissions:
  contents: write

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - name: Verify requested tag matches source version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid release tag format" }
          $version = python -c "import sys; sys.path.insert(0,'src'); from image_sheet_splitter.version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read APP_VERSION" }
          if (('v' + $version.Trim()) -ne $env:RELEASE_TAG) { throw "Tag does not match APP_VERSION" }
      - run: python scripts/check_root.py
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/write_version_info.py
      - run: python scripts/generate_icon.py
      - run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build-output build/windows/Image_Sheet_Splitter.spec
      - run: python scripts/verify_windows_build.py "dist/Image Sheet Splitter.exe"
      - name: Test replacement with the compiled portable application
        shell: pwsh
        run: |
          $env:ISS_TEST_COMPILED_EXE = (Resolve-Path 'dist/Image Sheet Splitter.exe').Path
          python -m unittest discover -s tests -p test_windows_updater.py -k test_compiled_app -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python scripts/package_release.py --exe "dist/Image Sheet Splitter.exe"
      - run: python scripts/verify_release.py
      - name: Validate release target and reject existing releases or mismatched tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$MAIN_SHA" ] || [ "$TARGET_SHA" != "$MAIN_SHA" ]; then
            echo "This token can only publish from the current main branch head."
            echo "Choose ref=main and retry. The application version does not need to change."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"
            if [ "$EXISTING" != "$TARGET_SHA" ]; then
              echo "Tag exists at a different commit; refusing to move it."
              exit 1
            fi
            echo "Existing tag matches the checked-out commit."
          else
            echo "Missing tag will be created by GitHub Releases at the verified main commit."
          fi
      - name: Create GitHub release with all three assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            release/Image_Sheet_Splitter_Windows_x64_Portable.zip \
            release/update-manifest.json \
            release/SHA256SUMS.txt \
            --target "$TARGET_SHA" \
            --title "Image Sheet Splitter $VERSION" \
            --notes-file "docs/releases/$VERSION.md"
      - name: Verify published assets, tag, and downloaded checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [ "$REMOTE_TAG_SHA" != "$TARGET_SHA" ]; then
            echo "Published tag does not point to the verified release commit."
            exit 1
          fi
          VERIFY_DIR="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$VERIFY_DIR" --pattern "Image_Sheet_Splitter_Windows_x64_Portable.zip" --pattern "update-manifest.json" --pattern "SHA256SUMS.txt"
          for asset in Image_Sheet_Splitter_Windows_x64_Portable.zip update-manifest.json SHA256SUMS.txt; do
            test -s "$VERIFY_DIR/$asset" || { echo "Missing or empty published asset: $asset"; exit 1; }
          done
          # The published checksum file may contain Windows CRLF endings.
          # Normalize only the downloaded local copy before GNU sha256sum.
          sed -i 's/\r$//' "$VERIFY_DIR/SHA256SUMS.txt"
          (cd "$VERIFY_DIR" && sha256sum -c SHA256SUMS.txt)
          echo "Verified published release tag, three downloadable assets, and SHA-256 digests."
