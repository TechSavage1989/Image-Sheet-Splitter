name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.7.0
        required: true
      ref:
        description: Commit or branch to release
        required: true
        default: main
      confirm:
        description: Type publish to confirm release creation
        required: true

permissions:
  contents: write

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - name: Verify requested tag matches source version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid release tag format" }
          $version = python -c "import sys; sys.path.insert(0,'src'); from image_sheet_splitter.version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read APP_VERSION" }
          if (('v' + $version.Trim()) -ne $env:RELEASE_TAG) { throw "Tag does not match APP_VERSION" }
      - run: python scripts/check_root.py
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/write_version_info.py
      - run: python scripts/generate_icon.py
      - run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build-output build/windows/Image_Sheet_Splitter.spec
      - run: python scripts/verify_windows_build.py "dist/Image Sheet Splitter.exe"
      - run: python scripts/package_release.py --exe "dist/Image Sheet Splitter.exe"
      - run: python scripts/verify_release.py
      - name: Refuse to overwrite an existing release and verify any existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            EXISTING="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$EXISTING" != "$TARGET_SHA" ]; then
              echo "Tag exists at a different commit; refusing to move it."
              exit 1
            fi
            echo "Existing tag points to the checked-out release commit; safe to resume release creation."
          else
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "$RELEASE_TAG"
          fi
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            release/Image_Sheet_Splitter_Windows_x64_Portable.zip \
            release/update-manifest.json \
            release/SHA256SUMS.txt \
            --title "Image Sheet Splitter $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --verify-tag
