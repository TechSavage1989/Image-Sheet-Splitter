name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/check_root.py
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src/image_sheet_splitter scripts

  source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/package_source.py
      - name: Extract source archive without Git metadata
        run: |
          mkdir extracted
          cd extracted
          python -m zipfile -e ../release/Image_Sheet_Splitter_Source.zip .
      - name: Validate extracted source
        run: |
          cd extracted/Image-Sheet-Splitter
          python scripts/check_root.py
          python scripts/check_docs.py
          python -m unittest discover -s tests -v
          python -m compileall -q src/image_sheet_splitter scripts

  windows-build:
    runs-on: windows-latest
    needs: [source-tests, source-archive]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/write_version_info.py
      - run: python scripts/generate_icon.py
      - run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build-output build/windows/Image_Sheet_Splitter.spec
      - run: python scripts/verify_windows_build.py "dist/Image Sheet Splitter.exe"
      - run: python scripts/package_release.py --exe "dist/Image Sheet Splitter.exe"
      - run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: image-sheet-splitter-windows-release-candidate
          path: |
            release/Image_Sheet_Splitter_Windows_x64_Portable.zip
            release/update-manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
